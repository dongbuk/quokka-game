const SOCIAL_STEM_PREFIXES=['','교과서 내용을 떠올려 봅시다. ','배운 내용을 생각하며 답하세요. ','다음 물음에 답하세요. '];
function isSocialCourse(course){return Object.prototype.hasOwnProperty.call(SOCIAL_UNITS,course)}
function normalizeSocialText(value){return String(value??'').normalize('NFC').toLowerCase().replace(/[\s·ㆍ･,，.。!！?？:：;；'"“”‘’「」『』〈〉《》()（）\[\]{}\-_]/g,'')}
function socialTextCorrect(q,value){const v=normalizeSocialText(value);return !!v&&(q.answers||[]).some(a=>normalizeSocialText(a)===v)}
function socialFactCounts(used,unit){const pool=SOCIAL_FACTS.filter(q=>q.unit===unit),counts=new Map(pool.map(q=>[q.id,0]));for(const sig of used||[]){const m=String(sig).match(/^social2\|([^|]+)\|(\d+)\|/);if(!m)continue;let id;try{id=decodeURIComponent(m[1])}catch(_){continue}const n=Number(m[2]);if(counts.has(id)&&Number.isSafeInteger(n)&&n>0)counts.set(id,Math.max(counts.get(id),n))}return{pool,counts}}
function socialChoiceSet(item,count){const answer=item.answer,all=[...new Set(item.distractors.filter(v=>v!==answer))],alen=String(answer).length;const near=[...all].sort((a,b)=>Math.abs(String(a).length-alen)-Math.abs(String(b).length-alen));const guards=near.filter(v=>String(v).length>=alen),picked=[];if(guards.length)picked.push(guards[(count-1)%guards.length]);const rest=near.filter(v=>!picked.includes(v)),shift=(count-1)%Math.max(1,rest.length),rotated=[...rest.slice(shift),...rest.slice(0,shift)];for(const v of rotated){if(picked.length>=3)break;if(!picked.includes(v))picked.push(v)}while(picked.length<3){const x=all.find(v=>!picked.includes(v));if(!x)break;picked.push(x)}return shuffle([answer,...picked])}
function makeSocialQuestion(unit,used=new Set()){if(!isSocialCourse(unit))throw Error('등록되지 않은 사회 단원입니다.');const{pool,counts}=socialFactCounts(used,unit);if(!pool.length)throw Error('선택한 사회 단원의 문제 자료가 비어 있습니다.');const min=Math.min(...counts.values());let candidates=pool.filter(q=>counts.get(q.id)===min);const recentTopics=[];for(const sig of [...(used||[])].reverse()){if(!String(sig).startsWith('social2|'))continue;const mm=String(sig).match(/^social2\|([^|]+)/);if(!mm)continue;let pid='';try{pid=decodeURIComponent(mm[1])}catch(_){}const pt=pool.find(x=>x.id===pid)?.topic;if(pt&&!recentTopics.includes(pt))recentTopics.push(pt);if(recentTopics.length>=3)break}if(candidates.length>1&&recentTopics.length){const diverse=candidates.filter(x=>!recentTopics.includes(x.topic));if(diverse.length)candidates=diverse}const item=candidates[rand(0,candidates.length-1)],count=counts.get(item.id)+1,prefix=SOCIAL_STEM_PREFIXES[(count-1)%SOCIAL_STEM_PREFIXES.length],sig='social2|'+encodeURIComponent(item.id)+'|'+count+'|'+item.entry;const base={bank:false,subjectId:'social',social:true,topic:item.topic||'',sourcePage:item.page,kind:item.unit,format:1,entry:item.entry,word:bankText(prefix+item.question),explanation:bankText(item.explanation),answer:rat(0),fs:[],unit:'',operation:'social',sig,attempts:0,answered:false};if(item.entry==='text')return{...base,answers:[...item.answers],answerText:item.answers[0]};const values=socialChoiceSet(item,count);return{...base,options:values.map(v=>({html:bankText(v),correct:v===item.answer}))}}

function makeDynamicItem(course){let unit,topic='';if(['fn','nf','ff'].includes(course)){unit='u2';topic=course}else if(course==='all')unit='u'+rand(1,6);else unit=course;switch(unit){case'u1':return dynamicU1();case'u2':return dynamicU2(topic);case'u3':return dynamicU3();case'u4':return dynamicU4();case'u5':return dynamicU5();case'u6':return dynamicU6();default:return null}}
function dynamicQuestion(course,used){for(let tries=0;tries<30;tries++){const item=makeDynamicItem(course);if(!item||!courseMatchesBankItem(item,course))continue;const sig='dyn|'+encodeURIComponent(item.id);if(used.has(sig))continue;used.add(sig);return bankQuestion(item,sig)}return null}
function makeQuestion(stage,index=0,used=new Set(),course=s?.course||selectedCourse,prefer={}){
 if(isSocialCourse(prefer.unit||course))return makeSocialQuestion(prefer.unit||course,used);
 // Keep the selected-unit safety rule for both fixed and generated questions.
 const dynamicCourse=prefer.unit||course;if(!prefer.noDynamic&&Math.random()<.60){const dq=dynamicQuestion(dynamicCourse,used);if(dq&&courseMatchesBankItem(dq.bankItem,dynamicCourse))return dq}
 let pool=bankPool(course);if(prefer.unit){const same=pool.filter(q=>q.unit===prefer.unit);if(same.length)pool=same}if(!pool.length)throw Error('선택한 단원의 QUESTION_BANK가 비어 있습니다.');

 const min=Math.min(...counts.values());let candidates=pool.filter(q=>counts.get(q.id)===min);const excluded=prefer.exclude||lastId;if(candidates.length>1)candidates=candidates.filter(q=>q.id!==excluded);
 if(prefer.topic){const same=candidates.filter(q=>q.topic===prefer.topic);if(same.length)candidates=same}
 const item=candidates[rand(0,candidates.length-1)];if(!item||!courseMatchesBankItem(item,course))throw Error('선택한 단원과 다른 문제가 감지되어 출제를 중단했습니다.');const sig='bank|'+encodeURIComponent(item.id)+'|'+(counts.get(item.id)+1);used.add(sig);return bankQuestion(item,sig);
}

function spawnQuorandyUnit(){const q=quorandy;if(!q||state!=='qr-playing'||q.energy<QR_RANDOM_SUMMON_COST||q.units.length>=q.map.slots.length)return false;let roll=Math.random()*100,rank=0;for(let i=0;i<QUORANDY_RANKS.length;i++){roll-=QUORANDY_RANKS[i].weight;if(roll<0){rank=i;break}}if(q.pity>=7)rank=Math.max(1,rank);q.pity=rank===0?q.pity+1:0;let slot=q.units.some(u=>u.slot===q.slot)?q.map.slots.findIndex((_,i)=>!q.units.some(u=>u.slot===i)):q.slot;q.energy-=QR_RANDOM_SUMMON_COST;q.summons++;qrAddUnit(qrRandomUnit(rank),slot);qrNotice(`${QUORANDY_RANKS[rank].name} · ${QUORANDY_UNITS[q.units.at(-1).id].name} 합류! ${qrRole(q.units.at(-1).id)[2]}`);qrAnnounce(qrUnitName(q.units.at(-1).id)+' 합류!',qrRole(q.units.at(-1).id)[1],QUORANDY_RANKS[rank].color);qrHUD();qrInfo();return true}

function qrRecipeCard(r,compact=false){const q=quorandy,ready=qrAvailable(r),known=qrProgress.discovered.includes(r.id),have=r.needs.filter(id=>qrOwnedCount(id)).length;return `<article class="qr-recipe-card ${ready?'ready':''}" style="--unit:${QR_LOOKS[r.result][0]}"><div class="qr-recipe-heading">${qrPortrait(r.result)}<div><span class="qr-eyebrow">${ready?'✦ 조합 준비 완료':known?'발견한 친구':'아직 만나지 않은 친구'}</span><h3>${qrUnitName(r.result)}</h3><p>${QR_RECIPE_HINTS[r.id]}</p></div></div><div class="qr-ingredients">${r.needs.map(id=>`<button data-qr-need="${id}" class="${qrOwnedCount(id)?'owned':'missing'}" aria-label="${qrUnitName(id)} ${qrOwnedCount(id)?'보유 중':'없음. 선택 소환 보기'}">${qrPortrait(id)}<b>${qrUnitName(id)}</b><small>${qrOwnedCount(id)?'✓ '+qrOwnedCount(id)+'명':'필요해요'}</small></button>`).join('<span>+</span>')}</div><div class="qr-recipe-progress"><i style="width:${have/3*100}%"></i></div><p class="qr-recipe-note">${have}/3명 준비 · 재료 3명은 새 친구로 바뀌어요.</p><div class="qr-recipe-actions"><button data-qr-recipe="${r.id}" ${!ready||q.energy<100?'disabled':''}>${ready?'✦ 조합하기 · 100':'재료를 모아 주세요'}</button>${!compact?`<button data-qr-pin="${r.id}" aria-pressed="${q.targetRecipe===r.id}">${q.targetRecipe===r.id?'목표로 선택됨':'이 친구를 목표로'}</button>`:''}</div></article>`}

function qrHelp(){if(!quorandy||!['qr-playing','qr-help'].includes(state))return;modal(`<span class="tag">처음 하는 친구를 위한 작은 안내서</span><h2 id="dialog-title">이번 버전 핵심 규칙</h2><div class="qr-how-grid"><div>${qrPortrait('bow')}<b>① 친구 만나기</b><p>랜덤 소환은 <strong>에너지 ${QR_RANDOM_SUMMON_COST}</strong>.<br>문제 정답은 <strong>+${QR_QUESTION_REWARD}</strong>을 받아요.</p></div><div>${qrPortrait('sun')}<b>② 키우고 판매하기</b><p>강화는 <strong>최대 +${QR_MAX_UPGRADE}</strong>.<br>판매하면 기준 구매가의 <strong>20%</strong>를 돌려받아요.</p></div><div>${qrPortrait('ice')}<b>③ 배치와 속도</b><p>옮길 쿼카를 누른 뒤 <strong>다른 쿼카를 누르면 바로 자리 교환</strong>되고 선택도 자동으로 풀려요.<br>속도 버튼은 <strong>1× → 2× → 3×</strong>로 바뀌어요.</p></div></div><div class="qr-help-note"><p>📘 <b>3웨이브마다 학습 관문</b>: 문제 ${QR_GATE_REQUIRED}개를 맞혀야 다음 웨이브로 갈 수 있어요.</p><p>🔥 <b>연속 정답 보너스</b>: 5·10·15…번째 연속 정답 순간마다 에너지 +100을 추가로 받아요.</p><p>⚠ 오답 뒤에는 <b>${QR_WRONG_WAIT}초 풀이 확인</b>. 연속 3회 오답은 현재 에너지 절반, 4회 이상은 0이 돼요.</p><p>🌼 <b>첫 번째 쿼카 → 두 번째 쿼카</b> 순서로 누르면 서로 자리를 바꾸고 <b>자동으로 선택 해제</b>돼요. 빈 꽃자리를 누르면 그 자리로 이동하고, 빈 맵 공간을 눌러도 선택을 해제할 수 있어요.</p><p>★ <b>대장 쿼카는 전장에 최대 1마리</b>만 보유할 수 있어요. 초월의 힘은 강하지만 이전보다 공격력·광역·보스 제어가 조정됐어요.</p></div><button id="qr-help-close" class="primary">좋아요, 숲을 지켜 볼게요!</button>`,'qr-help');$('qr-help-close').onclick=qrResume;qrPaintPortraits()}
function qrCodex(){if(!quorandy||!['qr-playing','qr-codex','qr-showcase'].includes(state))return;modal(`<span class="tag">쿼카랜덤디펜스 · 친구 도감</span><h2 id="dialog-title">잘하는 일이 모두 달라요</h2><p class="sub">친구를 누르면 공격 동작과 잘 어울리는 배치를 볼 수 있어요.</p><div class="qr-material-grid">${Object.values(QUORANDY_UNITS).map(d=>`<button data-qr-show="${d.id}">${qrPortrait(d.id)}<b>${qrUnitName(d.id)}</b><small>${qrRole(d.id)[0]} ${qrRole(d.id)[1]}</small></button>`).join('')}</div><button id="qr-codex-close" class="primary">전장으로 돌아가기</button>`,'qr-codex');$('panel').classList.add('qr-wide-panel');document.querySelectorAll('[data-qr-show]').forEach(b=>b.onclick=()=>qrShowcase(b.dataset.qrShow));$('qr-codex-close').onclick=qrResume;qrPaintPortraits()}

function qrPromotePreview(){const q=quorandy,u=q.units.find(u=>u.uid===q.selected);if(!u||state!=='qr-playing')return;const d=QUORANDY_UNITS[u.id],pool=q.units.filter(n=>QUORANDY_UNITS[n.id].rank===d.rank);if(pool.length<3||d.rank>=5)return;const transcend=d.rank===4;if(transcend&&qrHasCaptain()){qrNotice('★ 대장 쿼카는 최대 1마리예요. 기존 대장 쿼카를 판매하면 다시 초월할 수 있어요.');return}const picked=new Set([u.uid]);modal(`<span class="tag">${transcend?'★ 초월 합체':'같은 등급 친구 합치기'}</span><h2 id="dialog-title">${transcend?'전설 5성 중 원하는 3마리를 고르세요':'합칠 친구 3마리를 직접 고르세요'}</h2><p class="sub">원하지 않는 쿼카가 재료로 사라지지 않도록, 이번부터 재료를 직접 선택해요.</p><div id="qr-promote-pool" class="qr-material-grid">${pool.map(n=>`<button data-qr-pick="${n.uid}" aria-pressed="${picked.has(n.uid)}">${qrPortrait(n.id)}<b>${qrUnitName(n.id)}</b><small>${QUORANDY_RANKS[d.rank].name} · 강화 +${n.level}</small></button>`).join('')}</div>${transcend?`<div class="qr-transcendent-card" style="padding:14px;margin:14px 0">${qrPortrait('captain')}<h3 class="qr-transcendent-title">★ 대장 쿼카</h3><p class="qr-transcendent-note">전설 5성 3명 → 초월 큰 별 1명</p><p>짧은 슬로우 · 보스 추가 피해 20% · 광역 스플래시 · 매우 낮은 확률의 보스 원점 귀환을 가진 초월 지휘관이에요. <b>전장에는 1마리만</b> 둘 수 있어요.</p></div>`:`<p>${QUORANDY_RANKS[d.rank].name} 3명 → <b>${QUORANDY_RANKS[d.rank+1].name} 친구 1명</b><br>결과 친구는 무작위이며, 재료의 최고 강화 단계는 이어받아요.</p>`}<p id="qr-promote-count"><b>1 / 3 선택</b> · 에너지 50</p><div class="startrow"><button id="qr-promote-confirm" class="primary" disabled>${transcend?'★ 대장 쿼카 초월':'선택한 3마리 합치기'}</button><button id="qr-promote-cancel">그대로 둘래요</button></div>`,'qr-promote');const refresh=()=>{document.querySelectorAll('[data-qr-pick]').forEach(b=>b.setAttribute('aria-pressed',String(picked.has(Number(b.dataset.qrPick)))));$('qr-promote-count').innerHTML=`<b>${picked.size} / 3 선택</b> · 에너지 50`;$('qr-promote-confirm').disabled=picked.size!==3||q.energy<50};document.querySelectorAll('[data-qr-pick]').forEach(b=>b.onclick=()=>{const uid=Number(b.dataset.qrPick);if(picked.has(uid)){picked.delete(uid)}else if(picked.size<3){picked.add(uid)}else{qrNotice('합칠 쿼카는 3마리까지만 선택할 수 있어요.')}refresh()});$('qr-promote-confirm').onclick=()=>{if(picked.size!==3)return;const ids=[...picked];qrResume();combineQuorandyUnits(null,ids)};$('qr-promote-cancel').onclick=qrResume;refresh();qrPaintPortraits()}
function qrDrawUnit(c,x,y,id,scale=1.3,time=0,attack=0,facing=1){const d=QUORANDY_UNITS[id],look=QR_LOOKS[id],color=look[0],gear=look[1],hat=look[2],a=reduced?0:Math.sin(Math.max(0,attack)/.32*Math.PI),bob=reduced?0:Math.sin(time*3+id.length)*1.2;const r=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h)};c.save();c.translate(Math.round(x),Math.round(y));c.scale(scale,scale);c.fillStyle='#173e3338';c.beginPath();c.ellipse(0,7,19,6,0,0,Math.PI*2);c.fill();c.translate(facing*a*4,-Math.abs(a)*3+bob);if(id==='captain'){c.save();c.globalAlpha=.22+.08*Math.sin(time*4);const g=c.createRadialGradient(0,-14,3,0,-14,31);g.addColorStop(0,'#fff9cb');g.addColorStop(.42,'#ffd75a');g.addColorStop(.72,'#9c6cff');g.addColorStop(1,'#5b3ea000');c.fillStyle=g;c.beginPath();c.arc(0,-14,31,0,Math.PI*2);c.fill();c.globalAlpha=.75;for(let i=0;i<6;i++){const aa=time*.7+i*Math.PI/3;qrStar(c,Math.cos(aa)*27,-14+Math.sin(aa)*18,3,'#fff3a4')}c.restore();r(-19,-14,38,23,'#5f3f91');r(-16,-12,32,22,'#8a5dc7');r(-13,-10,26,20,'#f0c55c')}if(d.rank>=3){c.globalAlpha=.25;c.fillStyle=QUORANDY_RANKS[d.rank].color;c.beginPath();c.ellipse(0,0,23,11,0,0,Math.PI*2);c.fill();c.globalAlpha=1}if(['horn','star','scarf'].includes(hat)){r(-17,-19,34,23,'#354c56');r(-15,-18,30,21,color);r(-15,4,7,5,color);r(8,4,7,5,color)}r(-10,1,8,8,'#6e594c');r(3,1,8,8,'#6e594c');r(-12,-15,25,22,'#443f42');r(-10,-14,21,18,color);r(-5,-13,10,17,'#f6e2b4');r(-10,0,21,4,'#6e695c');r(-2,0,5,4,'#ffd98d');r(-15,-35,10,14,'#614d42');r(6,-35,10,14,'#614d42');r(-13,-33,6,9,'#c79668');r(8,-33,6,9,'#c79668');r(-15,-27,31,22,'#684e40');r(-12,-31,25,27,'#be915e');r(-14,-23,29,14,'#d6ad74');r(-10,-29,21,21,'#deb77f');r(-8,-17,17,13,'#f4d8a5');r(-9,-23,4,5,'#31383b');r(6,-23,4,5,'#31383b');r(-8,-23,1,2,'#fff4dc');r(7,-23,1,2,'#fff4dc');r(-2,-17,5,4,'#664d3c');r(-4,-11,3,2,'#9e7253');r(2,-11,3,2,'#9e7253');r(-12,-17,4,3,'#e7a78b');r(10,-17,4,3,'#e7a78b');
 if(hat==='hat'){r(-18,-30,37,5,'#695c89');r(-11,-41,23,11,color);r(-5,-49,11,9,color);r(-11,-33,23,4,'#ffe08c');r(1,-41,4,4,'#fff1c5')}
 if(hat==='band'||hat==='scarf'){r(-13,-31,27,5,color);r(11,-29,8,4,color);r(16,-27,5,10,color);if(hat==='scarf'){r(-12,-6,25,5,color);r(9,-3,8,15,color)}}
 if(hat==='leaf'||hat==='hood'){r(-15,-33,31,8,color);r(-11,-38,23,7,color);if(hat==='leaf'){r(2,-45,5,10,'#578658');r(6,-44,9,5,'#91c979')}else{r(-16,-28,4,17,color);r(13,-28,4,17,color)}}
 if(hat==='helm'){r(-15,-34,31,10,color);r(-11,-39,23,7,color);r(-16,-29,5,12,color);r(12,-29,5,12,color);r(-2,-38,5,19,'#eff2d4')}
 if(hat==='crown'||hat==='sun'){r(-14,-33,29,5,'#e0b273');for(let i=0;i<3;i++){r(-13+i*11,-40,6,9,color);r(-12+i*11,-44,4,4,color)}r(-2,-37,5,5,'#fff4d9')}
 if(hat==='goggles'){r(-14,-33,29,4,'#665957');r(-11,-36,9,8,'#564e51');r(3,-36,9,8,'#564e51');r(-9,-35,5,5,'#b4ebf6');r(5,-35,5,5,'#b4ebf6')}
 if(hat==='flame'){r(-8,-36,17,6,'#ca674d');r(-6,-44,5,11,'#ffb86e');r(0,-49,5,16,'#ffe69b');r(6,-41,5,8,'#ffbd77')}
 if(hat==='bolt'){r(-12,-31,25,5,'#bd9561');r(-1,-45,8,8,'#ffe392');r(-6,-38,10,6,'#ffe392');r(-4,-33,5,5,'#ffe392')}
 if(hat==='star'){qrStar(c,0,-39,10,color);qrStar(c,0,-39,5,'#fff2c7')}
 if(hat==='horn'){r(-15,-35,31,8,color);r(-19,-43,6,14,'#f3e2ba');r(14,-43,6,14,'#f3e2ba');r(-22,-46,6,7,'#f3e2ba');r(17,-46,6,7,'#f3e2ba')}
 if(hat==='royalcrown'){r(-16,-34,33,6,'#8f5d28');r(-15,-39,31,7,'#ffd966');for(let i=0;i<5;i++){const xx=-14+i*7;r(xx,-47+(i%2?3:0),6,11,'#ffe889');qrStar(c,xx+3,-47+(i%2?3:0),3,i===2?'#ff7e9d':'#fff7c7')}r(-12,-34,25,3,'#a76fcf');qrStar(c,0,-37,4,'#fff8d8')}

function qrStar(c,x,y,size,color){c.save();c.fillStyle=color;c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,r=i%2?size*.38:size;if(i)c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);else c.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}c.closePath();c.fill();c.restore()}

function qrAttackStyle(id){const d=QUORANDY_UNITS[id],gear=QR_LOOKS[id][1];return id==='captain'?'captainbeam':['sword','lance','hammer'].includes(gear)?'slash':gear==='bow'?'arrow':gear==='bomb'?'bombshot':d.skill==='chain'?'lightning':d.skill==='slow'?'icebolt':d.skill==='burn'?'fireball':d.skill==='poison'?'bubble':gear==='fan'?'gust':gear==='drum'?'music':'starbolt'}

function qrScene(m){const canvas=document.createElement('canvas');canvas.width=m.width;canvas.height=m.height;const c=canvas.getContext('2d'),project=p=>m.portrait?[p[1],p[0]]:p;c.imageSmoothingEnabled=false;const grad=c.createLinearGradient(0,0,m.width,m.height);grad.addColorStop(0,m.bg);grad.addColorStop(1,m.ground);c.fillStyle=grad;c.fillRect(0,0,m.width,m.height);for(let i=0;i<360;i++){const p=project([(i*137+41)%900,(i*79+17)%600]);c.fillStyle=i%4?'#f0ffd01b':'#234d3d0d';c.fillRect(p[0],p[1],3+(i%3)*2,3)}
 // Quiet garden / lake in the open middle. Never covers the route or the units.
 if(m.id===1){const p=project([480,305]);c.fillStyle='#c8d6a933';c.beginPath();c.ellipse(...p,m.portrait?32:165,m.portrait?165:32,0,0,Math.PI*2);c.fill()}if(m.id===2){const p=project([160,370]);c.fillStyle='#42728f';c.beginPath();c.ellipse(...p,m.portrait?85:102,m.portrait?102:85,0,0,Math.PI*2);c.fill();c.strokeStyle='#bfdde38c';c.lineWidth=4;for(let i=0;i<3;i++){const z=project([112+i*40,354+i*16]);c.beginPath();c.moveTo(z[0]-14,z[1]);c.lineTo(z[0]+14,z[1]);c.stroke()}}if(m.id===3){const p=project([455,300]);c.fillStyle='#c4d9ca';c.beginPath();c.ellipse(...p,m.portrait?23:175,m.portrait?175:23,0,0,Math.PI*2);c.fill();c.fillStyle='#e2e4cb';for(let i=0;i<5;i++){const z=project([330+i*60,300]);qrStar(c,...z,8,'#e8e3c2')}}if(m.id===4){const p=project([450,300]);c.fillStyle='#6e3f3540';c.beginPath();c.ellipse(...p,m.portrait?42:120,m.portrait?120:42,0,0,Math.PI*2);c.fill();for(let i=0;i<7;i++){const z=project([275+i*55,285+(i%2)*30]);qrStar(c,...z,6,i%2?'#ffd082':'#e98b69')}}if(m.id===5){for(let i=0;i<9;i++){const z=project([115+i*86,70+(i%3)*230]);qrStar(c,...z,5+(i%3),'#e8fbff')}const p=project([460,300]);c.strokeStyle='#bff6ff66';c.lineWidth=8;c.beginPath();c.arc(...p,95,0,Math.PI*2);c.stroke()}
 for(const path of m.paths){c.lineJoin='round';c.lineCap='round';c.beginPath();path.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.strokeStyle='#274d3d33';c.lineWidth=70;c.stroke();c.strokeStyle='#f4ebc8';c.lineWidth=62;c.stroke();c.strokeStyle=m.road;c.lineWidth=52;c.stroke();c.strokeStyle='#bdaf8455';c.lineWidth=2;c.setLineDash([2,16]);c.stroke();c.setLineDash([])}
 // Scenery stays away from the path and deployment spots.
 const distSeg=(p,a,b)=>{const vx=b[0]-a[0],vy=b[1]-a[1],t=clamp(((p[0]-a[0])*vx+(p[1]-a[1])*vy)/(vx*vx+vy*vy),0,1);return Math.hypot(p[0]-a[0]-vx*t,p[1]-a[1]-vy*t)};
 for(let i=0;i<60;i++){const p=project([24+(i*191)%852,24+(i*113)%552]);if(m.slots.some(s=>Math.hypot(s[0]-p[0],s[1]-p[1])<52)||m.paths.some(path=>path.slice(1).some((b,j)=>distSeg(p,path[j],b)<52)))continue;const[x,y]=p;if(m.id===1){c.fillStyle='#886a4e';c.fillRect(x-4,y-5,8,23);c.fillStyle='#5d9275';c.fillRect(x-19,y-27,38,30);c.fillRect(x-12,y-39,24,13);c.fillStyle='#75ab80';c.fillRect(x-16,y-29,29,18);c.fillStyle='#b2cf96';c.fillRect(x-10,y-34,10,5)}else if(m.id===2){c.fillStyle='#525784';c.fillRect(x-12,y-15,24,35);c.fillStyle='#b8d0e7';c.beginPath();c.moveTo(x-8,y+10);c.lineTo(x-8,y-24);c.lineTo(x,y-36);c.lineTo(x+9,y-19);c.lineTo(x+9,y+10);c.fill();c.fillStyle='#e3f4e9';c.fillRect(x-5,y-21,4,24);qrStar(c,x+11,y-24,5,'#dae5ff')}else if(m.id===3){c.fillStyle='#5a6e88';c.fillRect(x-16,y-15,32,34);c.fillStyle='#b2c8ce';c.fillRect(x-15,y-19,31,8);c.fillRect(x-15,y-25,7,8);c.fillRect(x-3,y-25,7,8);c.fillRect(x+9,y-25,7,8);c.fillStyle='#30475f';c.fillRect(x-3,y-9,6,12);c.fillStyle='#b3d697';c.fillRect(x-18,y+11,8,10)}else if(m.id===4){c.fillStyle='#6c4737';c.fillRect(x-4,y-5,8,24);c.fillStyle=i%3?'#d27950':'#efb35d';c.beginPath();c.arc(x,y-23,16,0,Math.PI*2);c.fill();c.fillStyle='#f2c975';c.fillRect(x-8,y-30,7,5)}else{c.fillStyle='#526f82';c.beginPath();c.moveTo(x-14,y+14);c.lineTo(x-8,y-14);c.lineTo(x,y-28);c.lineTo(x+10,y-10);c.lineTo(x+15,y+14);c.fill();c.fillStyle='#e7f4f2';c.fillRect(x-8,y-9,16,6);qrStar(c,x+12,y-21,4,'#f4ffff')}}
